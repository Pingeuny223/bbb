# CGV 잔여 좌석 감시 설정
#
# 이 파일은 레포에 커밋합니다. 토큰/웹훅 URL은 절대 여기 넣지 마세요.
# 알림 채널 인증 정보는 GitHub repo secrets 에만 둡니다. (README 참고)
#
# 현재 목표: 오디세이 / 8월 15일 / 12시 이후
#
# 롯데시네마 서울대입구(185석) 8/15 정중앙 좌석은 이미 확보해 뒀습니다.
# 그러므로 이 감시의 목적은 "예매하기"가 아니라 "그보다 나은 조건이 열리면
# 갈아타기"입니다. 185석 일반관 정중앙보다 확실히 나은 관만 걸어둡니다.
#
# 일반관끼리는 화면비가 같아 잘리는 영역이 동일하고, 관이 작으면 그만큼
# 가까이 앉으므로 시야각 차이도 작습니다. 그래서 3관·6관·7관·8관(124~200석)
# 같은 일반관은 '더 나은 조건'이 아니라 감시하지 않습니다.
#
# 요청 수는 "지점 × 날짜" 단위입니다. 같은 지점에 규칙을 여러 개 넣어도
# 요청은 늘지 않습니다. 그래서 지금 편성이 없는 관도 미리 넣어둡니다
# (나중에 편성이 추가되면 그대로 잡힙니다).

defaults:
  # 4~5명이 함께 봅니다. 4석 이상 열릴 때만 알립니다.
  #
  # 주의: CGV API는 "잔여 4석"만 줄 뿐 어느 자리인지는 주지 않습니다.
  # 4석 알림이 와도 붙어 있는 자리라는 보장은 없습니다.
  # 4~5명이 붙어 앉으려면 취소표보다 '신규 편성 오픈'이 현실적인 기회입니다.
  min_seats: 4

  # 전체 좌석 대비 최소 잔여 비율. 0 = 조건 없음.
  # 기본은 0 — 특별관(IMAX 등)은 자리가 얼마 없어도 볼 만하므로 다 알립니다.
  # 일반관처럼 좋은 자리가 아니면 갈 이유가 없는 곳에만 개별로 걸어둡니다.
  min_free_ratio: 0

  cooldown_minutes: 30
  failure_threshold: 3

  # 생존 신고 주기(시간). 12 = 하루 2회. 0 이면 끕니다.
  # 알림이 없는 게 '정상'인지 '죽은 것'인지 구분하기 위한 것이며,
  # 현재 잔여석 현황도 같이 실어 보냅니다.
  heartbeat_hours: 12

  # 새로 생긴 회차(= 편성 추가)도 알립니다.
  # 8/10~8/12 사이에 편성이 추가될 예정이라 켜둡니다.
  #
  # 이전 state가 있을 때만 동작합니다. 첫 실행이나 캐시 유실 시에는
  # 모든 회차가 '신규'로 보이므로 알림을 억제하고 기준선만 기록합니다.
  notify_on_first_seen: true

  # 편성만 올라오고 아직 예매가 열리지 않은 회차(0석)도 알립니다.
  # 그 시점엔 예매를 못 하지만 "이 회차가 생긴다"는 예고로 쓸모가 있습니다.
  # 예매가 실제로 열리면 '좌석 발생' 알림이 별도로 한 번 더 갑니다.
  notify_on_listed: true

  # 잔여석이 전체의 이 비율 아래로 떨어지면 "슬슬 찬다"고 한 번 알립니다.
  # 회차당 딱 한 번만 보냅니다. 기준선 근처에서 좌석이 오르내려도
  # 같은 경고가 반복되지 않습니다. 0 이면 끕니다.
  #
  # 지금 IMAX(0~6석)와 5관(32~48석)은 이미 이 선보다 한참 아래라 조용합니다.
  # 새로 열리는 돌비관이 차기 시작할 때 울리는 것이 이 설정의 목적입니다.
  alert_below_ratio: 0.65

polling:
  # GitHub 스케줄은 */5 로 걸어도 실제로는 한참 밀립니다(실측 89분 간격).
  # 그래서 '자주 깨어나기'가 아니라 '한 번 깨어나서 오래 돌기'로 주기를 만듭니다.
  #
  # 50분간 3분 간격 = 약 17라운드.
  # 실행이 끝나면 대기 중이던 다음 트리거가 바로 이어받아 사실상 끊기지 않습니다.
  run_duration_minutes: 50
  round_interval_sec: [170, 190] # 약 3분

  # run_duration_minutes 가 0일 때만 쓰입니다.
  rounds_per_run: 3

  request_delay_sec: [2.0, 5.0]

# 공통 조건 (YAML 앵커로 반복을 줄입니다)
_common: &common
  movie:
    title: "오디세이"
  date_range:
    start: "2026-08-15"
    end: "2026-08-15"
  time_range:
    start: "12:00"
    # 러닝타임이 광고 포함 182분(3시간 2분)이라 22시에 시작하면 새벽 1시가
    # 넘어 귀가가 어렵습니다. 22시 이후 시작 회차는 보지 않습니다.
    #
    # 이 상한에 걸리는 마지막 회차는 21:00 시작 / 00:02 종료입니다.
    # 자정 넘기는 것도 부담이면 20:00 으로 낮추세요(그러면 18:50 회차가 마지막).
    end: "22:00"

watches:
  # ── IMAX. 1.90:1 이라 일반관보다 화면을 26% 더 보여줍니다 ─────────
  # (원본 1.43:1 은 국내에서 용산아이파크몰 뿐인데, 거기는 624석에 잔여가
  #  항상 6석 이하로 고정이라 4~5명은 불가능해서 제외했습니다.)
  # 다만 여기도 8/15 잔여가 0~6석이라 기대치는 낮습니다.
  - <<: *common
    name: "★ 영등포 IMAX"
    theater: "영등포타임스퀘어"
    screen_types: ["IMAX"]

  # 5관 (일반, 320석). 롯시 185석과 화면비는 같지만 레이저 영사가 확정이고
  # 관이 더 커서 소폭 상향입니다. 다만 좋은 자리가 남아 있을 때만 의미가 있으므로
  # 절반 이상(160석) 남았을 때만 알립니다.
  - <<: *common
    name: "영등포 5관 (일반 320석)"
    theater: "영등포타임스퀘어"
    screen_types: ["5관"]
    min_free_ratio: 0.5

  # ── 아래는 8/15에 오디세이 편성이 없습니다 ───────────────────────
  # 영등포는 12개 관 중 8개만, 여의도는 3회차만 편성된 상태라 추가 편성이
  # 확실합니다. 요청 비용이 0이므로 미리 걸어둡니다.
  #
  # ★ 돌비애트모스 두 곳이 가장 유력한 후보입니다. 둘 다 8/15 미편성입니다.

  # 11관 스크린X 리클라이너 (218석) — API 표기: "SCREENX관 (리클라이너) with PRIVATE BOX"
  - <<: *common
    name: "영등포 SCREENX 리클라이너"
    theater: "영등포타임스퀘어"
    screen_types: ["SCREENX"]

  # 4관 돌비 애트모스 (195석) — 한국 최초 애트모스관
  - <<: *common
    name: "영등포 돌비애트모스"
    theater: "영등포타임스퀘어"
    screen_types: ["DOLBYATMOS"]

  # 1관 THX (358석) — 한국 유일 THX 인증관
  - <<: *common
    name: "영등포 THX"
    theater: "영등포타임스퀘어"
    screen_types: ["THX"]

  # 여의도 돌비 애트모스 (229석)
  # 8/14는 아직 상영 일정 자체가 열리지 않았습니다. 열리면 자동으로 조회합니다.
  - <<: *common
    name: "여의도 돌비애트모스"
    theater: "여의도"
    screen_types: ["DOLBYATMOS"]
# 감시 대상이 아닌 것 (이 도구는 CGV 전용입니다)
#   - 메가박스 코엑스 돌비시네마
#   - 롯데시네마 서울대입구
# 두 곳은 각각 별도의 예매 API를 새로 분석해야 합니다.

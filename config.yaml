# CGV 잔여 좌석 감시 설정
#
# 이 파일은 레포에 커밋합니다. 토큰/웹훅 URL은 절대 여기 넣지 마세요.
# 알림 채널 인증 정보는 GitHub repo secrets 에만 둡니다. (README 참고)
#
# 현재 목표: 오디세이 / 8월 14~15일 / 12시 이후 / CGV 특별관
#
# 요청 수는 "지점 × 날짜" 단위입니다. 같은 지점에 규칙을 여러 개 넣어도
# 요청은 늘지 않습니다. 그래서 지금 편성이 없는 관도 미리 넣어둡니다
# (나중에 편성이 추가되면 그대로 잡힙니다).

defaults:
  min_seats: 1
  cooldown_minutes: 30
  failure_threshold: 3

  # 새로 생긴 회차(= 편성 추가)도 알립니다.
  # 8/10~8/12 사이에 편성이 추가될 예정이라 켜둡니다.
  #
  # 이전 state가 있을 때만 동작합니다. 첫 실행이나 캐시 유실 시에는
  # 모든 회차가 '신규'로 보이므로 알림을 억제하고 기준선만 기록합니다.
  notify_on_first_seen: true

polling:
  # 3라운드 × 45~60초 = job 약 3분 50초.
  # cron 5분 간격 안에 여유 있게 들어와 실행이 겹치지 않습니다.
  rounds_per_run: 3
  round_interval_sec: [45, 60]
  request_delay_sec: [2.0, 5.0]

# 공통 조건 (YAML 앵커로 반복을 줄입니다)
_common: &common
  movie:
    title: "오디세이"
  date_range:
    start: "2026-08-14"
    end: "2026-08-15"
  time_range:
    start: "12:00"
    end: "27:00" # 24 이상 = 심야. 24:30 회차까지 포함합니다.

watches:
  # ── 1순위. 유일하게 실제 편성이 있는 관 ──────────────────────────
  # IMAX 필름 촬영작. 387석. 8/15 17:30 회차가 현재 0석.
  - <<: *common
    name: "★ 영등포 IMAX"
    theater: "영등포타임스퀘어"
    screen_types: ["IMAX"]

  # ── 아래는 현재 오디세이 편성이 없습니다 ─────────────────────────
  # 요청 비용이 0이라 편성 추가에 대비해 걸어둡니다.

  # 11관 스크린X 리클라이너 (218석) — API 표기: "SCREENX관 (리클라이너) with PRIVATE BOX"
  - <<: *common
    name: "영등포 SCREENX 리클라이너"
    theater: "영등포타임스퀘어"
    screen_types: ["SCREENX"]

  # 4관 돌비 애트모스 (195석) — 한국 최초 애트모스관
  - <<: *common
    name: "영등포 돌비애트모스"
    theater: "영등포타임스퀘어"
    screen_types: ["DOLBYATMOS"]

  # 1관 THX (358석) — 한국 유일 THX 인증관
  - <<: *common
    name: "영등포 THX"
    theater: "영등포타임스퀘어"
    screen_types: ["THX"]

  # 여의도 돌비 애트모스 (229석)
  # 8/14는 아직 상영 일정 자체가 열리지 않았습니다. 열리면 자동으로 조회합니다.
  - <<: *common
    name: "여의도 돌비애트모스"
    theater: "여의도"
    screen_types: ["DOLBYATMOS"]
# 감시 대상이 아닌 것 (이 도구는 CGV 전용입니다)
#   - 메가박스 코엑스 돌비시네마
#   - 롯데시네마 서울대입구
# 두 곳은 각각 별도의 예매 API를 새로 분석해야 합니다.
